<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股儀表板</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #1c2128;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #7d8590;
            --green: #3fb950;
            --red: #f85149;
            --green-bg: rgba(63,185,80,0.12);
            --red-bg: rgba(248,81,73,0.12);
            --accent: #388bfd;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:var(--bg-primary);
            color:var(--text-primary);
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
            min-height:100vh; font-size:14px;
        }

        /* ─── Header ─── */
        .header {
            background:var(--bg-secondary);
            border-bottom:1px solid var(--border);
            padding:14px 24px;
            display:flex; align-items:center; justify-content:space-between;
            position:sticky; top:0; z-index:100;
        }
        .header-title { font-size:18px; font-weight:700; }
        .header-sub { font-size:11px; color:var(--text-secondary); margin-top:2px; }
        .header-right { display:flex; align-items:center; gap:12px; }
        .status-wrap { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); }
        .dot {
            width:8px; height:8px; border-radius:50%;
            background:var(--text-secondary); flex-shrink:0;
        }
        .dot.live { background:var(--green); animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .refresh-btn {
            background:var(--bg-card); border:1px solid var(--border);
            color:var(--text-primary); padding:6px 14px; border-radius:6px;
            cursor:pointer; font-size:13px; transition:background .15s;
        }
        .refresh-btn:hover { background:var(--border); }
        .refresh-btn:disabled { opacity:.5; cursor:not-allowed; }

        /* ─── Layout ─── */
        .container { max-width:1600px; margin:0 auto; padding:24px; display:flex; flex-direction:column; gap:28px; }

        .section-title {
            font-size:15px; font-weight:600; margin-bottom:12px;
            display:flex; align-items:center; gap:8px;
        }
        .section-title::before {
            content:''; display:inline-block;
            width:3px; height:15px; background:var(--accent); border-radius:2px;
        }

        /* ─── Notice ─── */
        .notice {
            background:rgba(56,139,253,.1);
            border:1px solid rgba(56,139,253,.25);
            border-radius:8px; padding:10px 14px;
            font-size:12px; color:var(--text-secondary);
        }

        /* ─── Cards ─── */
        .cards-grid {
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
            gap:12px;
        }
        .card {
            background:var(--bg-card); border:1px solid var(--border);
            border-radius:10px; padding:16px;
        }
        .card-label { font-size:11px; color:var(--text-secondary); margin-bottom:8px; text-transform:uppercase; letter-spacing:.4px; }
        .card-value { font-size:22px; font-weight:700; line-height:1; }
        .card-sub { font-size:12px; color:var(--text-secondary); margin-top:6px; }
        .up { color:var(--green); }
        .down { color:var(--red); }
        .neutral { color:var(--text-secondary); }

        /* ─── Heatmap ─── */
        .heatmap-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
            gap:6px;
        }
        .heatmap-cell {
            border-radius:8px; padding:12px; cursor:default;
            transition:transform .1s,filter .1s; position:relative; overflow:hidden;
        }
        .heatmap-cell:hover { transform:scale(1.03); filter:brightness(1.1); }
        .cell-name { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .cell-pct { font-size:18px; font-weight:700; margin-top:4px; }
        .cell-idx { font-size:11px; opacity:.75; margin-top:2px; }

        /* ─── Rankings ─── */
        .rankings-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        .rank-box { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
        .rank-box-title { padding:12px 16px; border-bottom:1px solid var(--border); font-size:14px; font-weight:600; }
        .rank-box table { width:100%; border-collapse:collapse; }
        .rank-box th {
            padding:8px 12px; text-align:left;
            font-size:11px; color:var(--text-secondary);
            border-bottom:1px solid var(--border);
            text-transform:uppercase; letter-spacing:.4px;
        }
        .rank-box td { padding:9px 12px; font-size:13px; border-bottom:1px solid rgba(48,54,61,.5); }
        .rank-box tr:last-child td { border-bottom:none; }
        .rank-box tr:hover td { background:rgba(255,255,255,.03); }
        .rank-no { color:var(--text-secondary); font-size:12px; }
        .code { font-family:monospace; color:var(--accent); font-size:12px; }
        .badge {
            display:inline-block; padding:2px 7px; border-radius:4px;
            font-size:11px; font-weight:700;
        }
        .badge.up { background:var(--green-bg); color:var(--green); }
        .badge.down { background:var(--red-bg); color:var(--red); }

        /* ─── Search ─── */
        .search-box { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
        .search-bar { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; gap:10px; }
        .search-input {
            flex:1; background:var(--bg-secondary); border:1px solid var(--border);
            border-radius:6px; padding:8px 14px; color:var(--text-primary);
            font-size:14px; outline:none; transition:border-color .15s;
        }
        .search-input:focus { border-color:var(--accent); }
        .search-input::placeholder { color:var(--text-secondary); }
        .search-body { max-height:480px; overflow-y:auto; }
        .search-table { width:100%; border-collapse:collapse; }
        .search-table th {
            padding:9px 14px; text-align:left;
            font-size:11px; color:var(--text-secondary);
            border-bottom:1px solid var(--border);
            text-transform:uppercase; letter-spacing:.4px;
            position:sticky; top:0; background:var(--bg-card); z-index:1;
        }
        .search-table td { padding:9px 14px; font-size:13px; border-bottom:1px solid rgba(48,54,61,.5); }
        .search-table tr:last-child td { border-bottom:none; }
        .search-table tr:hover td { background:rgba(255,255,255,.03); }
        .empty { padding:36px; text-align:center; color:var(--text-secondary); font-size:13px; }

        /* ─── Skeleton ─── */
        .skel {
            background:linear-gradient(90deg,var(--bg-card) 25%,var(--border) 50%,var(--bg-card) 75%);
            background-size:200% 100%; animation:shimmer 1.5s infinite;
            border-radius:6px;
        }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        /* ─── Responsive ─── */
        @media(max-width:900px) {
            .rankings-grid { grid-template-columns:1fr; }
            .heatmap-grid { grid-template-columns:repeat(3,1fr); }
        }
        @media(max-width:600px) {
            .cards-grid { grid-template-columns:repeat(2,1fr); }
            .heatmap-grid { grid-template-columns:repeat(2,1fr); }
            .container { padding:12px; gap:20px; }
        }
    </style>
</head>
<body>

<!-- ═══ Header ═══ -->
<div class="header">
    <div>
        <div class="header-title">🇹🇼 台股儀表板</div>
        <div class="header-sub">Taiwan Stock Exchange Dashboard</div>
    </div>
    <div class="header-right">
        <div class="status-wrap">
            <div class="dot" id="statusDot"></div>
            <span id="lastUpdated">讀取中…</span>
        </div>
        <button class="refresh-btn" id="refreshBtn" onclick="loadAll()">↻ 更新</button>
    </div>
</div>

<!-- ═══ Main ═══ -->
<div class="container">

    <div class="notice" id="notice">
        📊 資料來源：台灣證券交易所 TWSE OpenAPI（盤後資料，交易日收盤後更新）
    </div>

    <!-- 大盤概覽 -->
    <div>
        <div class="section-title">大盤概覽</div>
        <div class="cards-grid" id="marketCards">
            <div class="card"><div class="card-label">加權指數</div><div class="skel" style="height:32px;margin-top:6px"></div></div>
            <div class="card"><div class="card-label">漲跌幅</div><div class="skel" style="height:32px;margin-top:6px"></div></div>
            <div class="card"><div class="card-label">漲跌點數</div><div class="skel" style="height:32px;margin-top:6px"></div></div>
            <div class="card"><div class="card-label">上漲家數</div><div class="skel" style="height:32px;margin-top:6px"></div></div>
            <div class="card"><div class="card-label">下跌家數</div><div class="skel" style="height:32px;margin-top:6px"></div></div>
            <div class="card"><div class="card-label">平盤家數</div><div class="skel" style="height:32px;margin-top:6px"></div></div>
        </div>
    </div>

    <!-- 產業熱力圖 -->
    <div>
        <div class="section-title">產業熱力圖</div>
        <div class="heatmap-grid" id="heatmapGrid">
            ${Array(20).fill(0).map(()=>`<div class="heatmap-cell skel" style="height:76px"></div>`).join('')}
        </div>
    </div>

    <!-- 漲跌排行 -->
    <div>
        <div class="section-title">當日漲跌排行</div>
        <div class="rankings-grid">
            <div class="rank-box">
                <div class="rank-box-title">🔺 漲幅前 15</div>
                <table><thead><tr>
                    <th>#</th><th>代號</th><th>名稱</th><th>收盤</th><th>漲跌幅</th>
                </tr></thead>
                <tbody id="gainersBody"><tr><td colspan="5" class="empty">載入中…</td></tr></tbody>
                </table>
            </div>
            <div class="rank-box">
                <div class="rank-box-title">🔻 跌幅前 15</div>
                <table><thead><tr>
                    <th>#</th><th>代號</th><th>名稱</th><th>收盤</th><th>漲跌幅</th>
                </tr></thead>
                <tbody id="losersBody"><tr><td colspan="5" class="empty">載入中…</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 個股搜尋 -->
    <div>
        <div class="section-title">個股搜尋</div>
        <div class="search-box">
            <div class="search-bar">
                <input id="searchInput" class="search-input" type="text"
                    placeholder="輸入股票代號或名稱（如：2330 或 台積電）"
                    oninput="handleSearch(this.value)" autocomplete="off">
            </div>
            <div class="search-body" id="searchBody">
                <div class="empty">請輸入股票代號或名稱開始搜尋</div>
            </div>
        </div>
    </div>

</div>

<script>
// ─── Config ───────────────────────────────────────────────
const BASE = 'https://openapi.twse.com.tw/v1';

// ─── State ────────────────────────────────────────────────
let allStocks = [];     // parsed individual stock records
let rawSectors = [];    // raw sector API response

// ─── Helpers ──────────────────────────────────────────────
const num = s => {
    if (!s || s === '--' || s === 'N/A' || s === '') return NaN;
    return parseFloat(String(s).replace(/,/g, ''));
};
const fmt = (n, d = 2) =>
    isNaN(n) ? '--' : n.toLocaleString('zh-TW', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtVol = n => {
    if (isNaN(n) || n === 0) return '--';
    if (n >= 1e8) return (n/1e8).toFixed(2) + ' 億';
    if (n >= 1e4) return (n/1e4).toFixed(0) + ' 萬';
    return n.toLocaleString();
};
const sign = n => n >= 0 ? '+' : '';

// heatmap colour: -10% → red, 0 → dark grey, +10% → green
function heatColor(pct) {
    const p = Math.max(-10, Math.min(10, pct));
    if (p === 0) return '#2d333b';
    if (p > 0) {
        const t = p / 10;
        return `rgb(${Math.round(30*(1-t))},${Math.round(60+140*t)},${Math.round(30*(1-t))})`;
    } else {
        const t = -p / 10;
        return `rgb(${Math.round(90+140*t)},${Math.round(30*(1-t))},${Math.round(30*(1-t))})`;
    }
}

// ─── Fetch ────────────────────────────────────────────────
async function getJSON(path) {
    const r = await fetch(BASE + path);
    if (!r.ok) throw new Error(`HTTP ${r.status} – ${path}`);
    return r.json();
}

// ─── Parse stocks ────────────────────────────────────────
function parseStocks(raw) {
    return raw
        .filter(s => /^\d{4}$/.test(s.Code ?? s['證券代號'] ?? ''))
        .map(s => {
            const close   = num(s.ClosingPrice  ?? s['收盤價']);
            const changeN = num(s.Change         ?? s['漲跌價差']);
            const prev    = close - changeN;
            const pct     = (prev !== 0 && !isNaN(prev) && !isNaN(changeN))
                                ? (changeN / prev) * 100 : NaN;
            return {
                code:   s.Code        ?? s['證券代號'],
                name:   s.Name        ?? s['證券名稱'],
                open:   num(s.OpeningPrice ?? s['開盤價']),
                high:   num(s.HighestPrice ?? s['最高價']),
                low:    num(s.LowestPrice  ?? s['最低價']),
                close,
                change: changeN,
                pct,
                vol:    num(s.TradeVolume  ?? s['成交股數']),
                val:    num(s.TradeValue   ?? s['成交金額']),
            };
        })
        .filter(s => !isNaN(s.close) && s.close > 0);
}

// ─── Render: market cards ─────────────────────────────────
function renderMarket(indexRows) {
    // MI_INDEX returns many rows; find the 加權指數 / TSE weighted
    const row = indexRows.find(r => {
        const n = (r.Index ?? r['指數'] ?? r.Name ?? '').toString();
        return /加權|TSE Weighted|TAIEX/i.test(n);
    }) ?? indexRows[0] ?? {};

    const idx    = num(row.Index      ?? row['指數']      ?? row.ClosePrice);
    const chg    = num(row.Change     ?? row['漲跌']);
    const chgPct = num(row.ChangePer  ?? row.ChangePercent ?? row['漲跌百分比'] ?? row['漲跌(%)']);

    // breadth from individual stocks (more reliable)
    const ups   = allStocks.filter(s => s.change > 0).length;
    const downs = allStocks.filter(s => s.change < 0).length;
    const flat  = allStocks.filter(s => s.change === 0).length;

    const cards = [
        { label:'加權指數',  value: fmt(idx,2),  sub:null,                        cls:'' },
        { label:'漲跌幅',    value: sign(chgPct)+fmt(chgPct,2)+'%', sub:null,     cls: chgPct>=0?'up':'down' },
        { label:'漲跌點數',  value: sign(chg)+fmt(chg,2),           sub:null,     cls: chg>=0?'up':'down' },
        { label:'上漲家數',  value: ups.toString(),   sub:null,                   cls:'up' },
        { label:'下跌家數',  value: downs.toString(), sub:null,                   cls:'down' },
        { label:'平盤家數',  value: flat.toString(),  sub:null,                   cls:'neutral' },
    ];

    document.getElementById('marketCards').innerHTML = cards.map(c => `
        <div class="card">
            <div class="card-label">${c.label}</div>
            <div class="card-value ${c.cls}">${c.value}</div>
        </div>`).join('');
}

// ─── Render: heatmap ─────────────────────────────────────
function renderHeatmap(rows) {
    // Detect field names from first row
    const sample = rows[0] ?? {};
    const getName = r => r.Name ?? r['類股名稱'] ?? r['指數名稱'] ?? r['Index'] ?? '';
    const getIdx  = r => num(r.Index ?? r['指數'] ?? r.ClosePrice ?? r['收盤']);
    const getPct  = r => {
        let v = num(r.ChangePer ?? r.ChangePercent ?? r['漲跌百分比'] ?? r['漲跌(%)'] ?? r['ChgPer']);
        // Sometimes percentage comes without ± sign but there's a separate 漲跌 field
        if (isNaN(v)) {
            const chg  = num(r.Change ?? r['漲跌']);
            const idx  = getIdx(r);
            const prev = idx - chg;
            if (prev !== 0 && !isNaN(chg)) v = (chg / prev) * 100;
        }
        return v;
    };

    const sectors = rows
        .map(r => ({ name: getName(r), idx: getIdx(r), pct: getPct(r) }))
        .filter(s => s.name && !isNaN(s.pct));

    if (sectors.length === 0) {
        document.getElementById('heatmapGrid').innerHTML =
            `<div style="color:var(--text-secondary);padding:20px;font-size:12px">
             ⚠️ 產業資料無法解析，可能為假日無資料</div>`;
        console.info('Sector raw sample:', sample);
        return;
    }

    document.getElementById('heatmapGrid').innerHTML = sectors.map(s => {
        const bg  = heatColor(s.pct);
        const sym = s.pct >= 0 ? '▲' : '▼';
        return `<div class="heatmap-cell" style="background:${bg}" title="${s.name}">
            <div class="cell-name">${s.name}</div>
            <div class="cell-pct">${sym} ${Math.abs(s.pct).toFixed(2)}%</div>
            <div class="cell-idx">${fmt(s.idx, 2)}</div>
        </div>`;
    }).join('');
}

// ─── Render: rankings ────────────────────────────────────
function renderRankings() {
    const valid = allStocks.filter(s => !isNaN(s.pct) && isFinite(s.pct));
    const sorted = [...valid].sort((a,b) => b.pct - a.pct);
    const gainers = sorted.slice(0,15);
    const losers  = sorted.slice(-15).reverse();

    const row = (s, i) => {
        const cls = s.pct >= 0 ? 'up' : 'down';
        return `<tr>
            <td class="rank-no">${i+1}</td>
            <td><span class="code">${s.code}</span></td>
            <td>${s.name}</td>
            <td>${fmt(s.close)}</td>
            <td><span class="badge ${cls}">${sign(s.pct)}${fmt(s.pct,2)}%</span></td>
        </tr>`;
    };

    document.getElementById('gainersBody').innerHTML = gainers.map(row).join('') || '<tr><td colspan="5" class="empty">無資料</td></tr>';
    document.getElementById('losersBody').innerHTML  = losers.map(row).join('')  || '<tr><td colspan="5" class="empty">無資料</td></tr>';
}

// ─── Search ───────────────────────────────────────────────
function handleSearch(q) {
    const body = document.getElementById('searchBody');
    q = q.trim().toLowerCase();

    if (!q) { body.innerHTML = '<div class="empty">請輸入股票代號或名稱開始搜尋</div>'; return; }
    if (!allStocks.length) { body.innerHTML = '<div class="empty">資料載入中，請稍候…</div>'; return; }

    const res = allStocks
        .filter(s => s.code.includes(q) || s.name.toLowerCase().includes(q))
        .slice(0, 40);

    if (!res.length) {
        body.innerHTML = `<div class="empty">找不到「${q}」相關股票</div>`;
        return;
    }

    body.innerHTML = `
        <table class="search-table">
            <thead><tr>
                <th>代號</th><th>名稱</th>
                <th>開盤</th><th>最高</th><th>最低</th><th>收盤</th>
                <th>漲跌</th><th>漲跌幅</th><th>成交量</th>
            </tr></thead>
            <tbody>${res.map(s => {
                const cls = s.pct > 0 ? 'up' : s.pct < 0 ? 'down' : 'neutral';
                return `<tr>
                    <td><span class="code">${s.code}</span></td>
                    <td><strong>${s.name}</strong></td>
                    <td>${fmt(s.open)}</td>
                    <td class="up">${fmt(s.high)}</td>
                    <td class="down">${fmt(s.low)}</td>
                    <td><strong>${fmt(s.close)}</strong></td>
                    <td class="${cls}">${sign(s.change)}${fmt(s.change)}</td>
                    <td><span class="badge ${s.pct>=0?'up':'down'}">${sign(s.pct)}${fmt(s.pct,2)}%</span></td>
                    <td>${fmtVol(s.vol)}</td>
                </tr>`;
            }).join('')}</tbody>
        </table>`;
}

// ─── Status bar ───────────────────────────────────────────
function setStatus(ok) {
    document.getElementById('statusDot').className = 'dot' + (ok ? ' live' : '');
    const now = new Date().toLocaleTimeString('zh-TW', { timeZone:'Asia/Taipei', hour12:false });
    document.getElementById('lastUpdated').textContent = `更新 ${now}`;
}

// ─── Main load ────────────────────────────────────────────
async function loadAll() {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.textContent = '更新中…';

    try {
        // Fetch all three endpoints in parallel
        const [stocksRaw, sectorsRaw, indexRaw] = await Promise.allSettled([
            getJSON('/exchangeReport/STOCK_DAY_ALL'),
            getJSON('/exchangeReport/MI_INDEX20'),
            getJSON('/exchangeReport/MI_INDEX'),
        ]);

        // ── Stocks ──
        if (stocksRaw.status === 'fulfilled' && Array.isArray(stocksRaw.value)) {
            allStocks = parseStocks(stocksRaw.value);
            renderRankings();
            // re-render search if user already typed something
            const q = document.getElementById('searchInput').value;
            if (q) handleSearch(q);
        } else {
            console.warn('個股資料失敗', stocksRaw.reason);
            ['gainersBody','losersBody'].forEach(id =>
                document.getElementById(id).innerHTML = '<tr><td colspan="5" class="empty">⚠️ 資料無法取得（可能為假日）</td></tr>');
        }

        // ── Sectors ──
        if (sectorsRaw.status === 'fulfilled' && Array.isArray(sectorsRaw.value)) {
            renderHeatmap(sectorsRaw.value);
        } else {
            console.warn('產業資料失敗', sectorsRaw.reason);
            document.getElementById('heatmapGrid').innerHTML =
                '<div style="color:var(--text-secondary);padding:20px">⚠️ 產業資料無法取得（可能為假日）</div>';
        }

        // ── Market index ──
        if (indexRaw.status === 'fulfilled' && Array.isArray(indexRaw.value)) {
            renderMarket(indexRaw.value);
        } else {
            // Fallback: derive market cards from stock breadth only
            renderMarket([]);
        }

        setStatus(true);

    } catch(e) {
        console.error('loadAll error', e);
        setStatus(false);
    } finally {
        btn.disabled = false;
        btn.textContent = '↻ 更新';
    }
}

// ─── Trading hours notice + auto-refresh ─────────────────
function checkTradingHours() {
    const now = new Date();
    const hm  = now.toLocaleTimeString('zh-TW', {timeZone:'Asia/Taipei', hour12:false});
    const [h, m] = hm.split(':').map(Number);
    const mins = h * 60 + m;
    const isWeekday = [1,2,3,4,5].includes(new Date(
        now.toLocaleString('en-US', {timeZone:'Asia/Taipei'})).getDay());

    if (isWeekday && mins >= 9*60 && mins <= 13*60+30) {
        document.getElementById('notice').innerHTML =
            '🔴 <strong>交易進行中</strong>（09:00–13:30）— 每 5 分鐘自動更新';
        return 5 * 60 * 1000;   // refresh every 5 min during trading
    } else {
        document.getElementById('notice').innerHTML =
            '📊 資料來源：台灣證券交易所 TWSE OpenAPI（盤後資料，交易日收盤後更新）';
        return null;
    }
}

async function autoRefreshLoop() {
    await loadAll();
    const delay = checkTradingHours();
    if (delay) setTimeout(autoRefreshLoop, delay);
}

// ─── Init ─────────────────────────────────────────────────
autoRefreshLoop();
</script>
