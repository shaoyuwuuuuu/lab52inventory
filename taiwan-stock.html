<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股儀表板</title>
    <style>
        :root {
            --bg:      #0d1117;
            --bg2:     #161b22;
            --bg3:     #1c2128;
            --border:  #30363d;
            --txt:     #e6edf3;
            --txt2:    #7d8590;
            --green:   #3fb950;
            --red:     #f85149;
            --gbg:     rgba(63,185,80,.13);
            --rbg:     rgba(248,81,73,.13);
            --blue:    #388bfd;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--txt);
             font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
             font-size:14px;min-height:100vh}

        /* ─── header ─── */
        .hdr{background:var(--bg2);border-bottom:1px solid var(--border);
             padding:13px 22px;display:flex;align-items:center;
             justify-content:space-between;position:sticky;top:0;z-index:200}
        .hdr-title{font-size:17px;font-weight:700}
        .hdr-sub{font-size:11px;color:var(--txt2);margin-top:1px}
        .hdr-r{display:flex;align-items:center;gap:10px}
        .dot{width:8px;height:8px;border-radius:50%;
             background:var(--txt2);flex-shrink:0;transition:background .3s}
        .dot.live{background:var(--green);animation:blink 2s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
        .ts{font-size:12px;color:var(--txt2)}
        .btn{background:var(--bg3);border:1px solid var(--border);color:var(--txt);
             padding:5px 13px;border-radius:6px;cursor:pointer;font-size:13px;
             transition:background .15s}
        .btn:hover{background:var(--border)}
        .btn:disabled{opacity:.45;cursor:not-allowed}

        /* ─── layout ─── */
        .wrap{max-width:1640px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:24px}
        .notice{background:rgba(56,139,253,.1);border:1px solid rgba(56,139,253,.25);
                border-radius:8px;padding:9px 14px;font-size:12px;color:var(--txt2)}
        .sec-title{font-size:14px;font-weight:600;margin-bottom:12px;
                   display:flex;align-items:center;gap:7px}
        .sec-title::before{content:'';display:inline-block;
                           width:3px;height:14px;background:var(--blue);border-radius:2px}

        /* ─── overview cards ─── */
        .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
        .card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px}
        .card-lbl{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px}
        .card-val{font-size:21px;font-weight:700;line-height:1}
        .up{color:var(--green)}.down{color:var(--red)}.neu{color:var(--txt2)}

        /* ─── tabs ─── */
        .tab-row{display:flex;gap:3px;margin-bottom:12px}
        .tab{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;
             color:var(--txt2);border:1px solid transparent;transition:all .15s}
        .tab:hover{color:var(--txt)}
        .tab.on{background:var(--bg3);border-color:var(--border);color:var(--txt);font-weight:600}

        /* ─── sector treemap ─── */
        .treemap{display:flex;flex-wrap:wrap;gap:5px;min-height:130px}
        .s-cell{border-radius:7px;padding:10px 12px;cursor:default;
                transition:filter .12s,transform .12s;flex-shrink:0;flex-basis:100px;min-width:90px}
        .s-cell:hover{filter:brightness(1.12);transform:scale(1.02);z-index:1}
        .s-cell.selected{outline:2px solid #fff;outline-offset:1px}
        .s-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .s-pct{font-size:17px;font-weight:700;margin-top:4px}
        .s-idx{font-size:10px;opacity:.75;margin-top:2px}

        /* ─── stocks table ─── */
        .tbl-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:10px;overflow:hidden}
        .tbl-top{padding:12px 14px;border-bottom:1px solid var(--border);
                 display:flex;flex-wrap:wrap;align-items:center;gap:10px}
        .search-in{background:var(--bg2);border:1px solid var(--border);border-radius:6px;
                   padding:7px 13px;color:var(--txt);font-size:13px;outline:none;
                   transition:border-color .15s;width:220px}
        .search-in:focus{border-color:var(--blue)}
        .search-in::placeholder{color:var(--txt2)}
        .sort-row{display:flex;gap:6px;flex-wrap:wrap}
        .sort-btn{background:var(--bg2);border:1px solid var(--border);color:var(--txt2);
                  padding:5px 12px;border-radius:5px;cursor:pointer;font-size:12px;
                  transition:all .15s;white-space:nowrap}
        .sort-btn:hover{color:var(--txt);border-color:var(--txt2)}
        .sort-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
        .tbl-scroll{max-height:600px;overflow-y:auto}
        table{width:100%;border-collapse:collapse}
        th{padding:8px 12px;text-align:left;font-size:11px;color:var(--txt2);
           border-bottom:1px solid var(--border);text-transform:uppercase;
           letter-spacing:.4px;position:sticky;top:0;background:var(--bg3);
           cursor:pointer;white-space:nowrap;user-select:none}
        th:hover{color:var(--txt)}
        th .arr{margin-left:3px;opacity:.5;font-size:10px}
        th.sorted .arr{opacity:1}
        td{padding:8px 12px;font-size:13px;border-bottom:1px solid rgba(48,54,61,.45);
           white-space:nowrap}
        tr:last-child td{border-bottom:none}
        tr:hover td{background:rgba(255,255,255,.025)}
        .code{font-family:monospace;color:var(--blue);font-size:12px}
        .badge{display:inline-block;padding:2px 7px;border-radius:4px;
               font-size:11px;font-weight:700}
        .badge.up{background:var(--gbg);color:var(--green)}
        .badge.down{background:var(--rbg);color:var(--red)}
        .badge.neu{background:rgba(125,133,144,.12);color:var(--txt2)}
        .mkt-tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;
                 margin-left:4px;vertical-align:middle}
        .mkt-tag.twse{background:rgba(56,139,253,.15);color:var(--blue)}
        .mkt-tag.tpex{background:rgba(188,140,255,.15);color:#bc8cff}
        .tbl-foot{padding:10px 14px;border-top:1px solid var(--border);
                  font-size:12px;color:var(--txt2);display:flex;justify-content:space-between;align-items:center}
        .pg-btn{background:var(--bg2);border:1px solid var(--border);color:var(--txt);
                padding:4px 12px;border-radius:5px;cursor:pointer;font-size:12px}
        .pg-btn:disabled{opacity:.4;cursor:not-allowed}

        /* ─── skeleton ─── */
        .skel{background:linear-gradient(90deg,var(--bg3) 25%,var(--border) 50%,var(--bg3) 75%);
              background-size:200% 100%;animation:sk 1.5s infinite;border-radius:6px}
        @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
        .empty{padding:32px;text-align:center;color:var(--txt2);font-size:13px}

        /* ─── responsive ─── */
        @media(max-width:900px){
            .cards{grid-template-columns:repeat(3,1fr)}
            .tbl-top{flex-direction:column;align-items:flex-start}
        }
        @media(max-width:600px){
            .cards{grid-template-columns:repeat(2,1fr)}
            .wrap{padding:12px;gap:18px}
        }
    </style>
</head>
<body>

<!-- ═══ Header ═══ -->
<div class="hdr">
    <div>
        <div class="hdr-title">🇹🇼 台股儀表板</div>
        <div class="hdr-sub">TWSE &amp; TPEX Dashboard</div>
    </div>
    <div class="hdr-r">
        <div class="dot" id="dot"></div>
        <span class="ts" id="ts">讀取中…</span>
        <button class="btn" id="rfBtn" onclick="loadAll()">↻ 更新</button>
    </div>
</div>

<div class="wrap">

<!-- notice -->
<div class="notice" id="notice">
    📊 資料來源：台灣證券交易所 TWSE + 櫃買中心 TPEX OpenAPI（盤後資料）
</div>

<!-- ①  大盤概覽 -->
<div>
    <div class="sec-title">大盤概覽</div>
    <div class="cards" id="cards">
        ${[...Array(8)].map(()=>`<div class="card"><div class="card-lbl">—</div><div class="skel" style="height:28px;margin-top:6px"></div></div>`).join('')}
    </div>
</div>

<!-- ② 類股熱力圖 -->
<div>
    <div class="sec-title">類股熱力圖</div>
    <div class="tab-row" id="hmTabs">
        <div class="tab on" onclick="setHmTab('twse',this)">上市類股</div>
        <div class="tab" onclick="setHmTab('tpex',this)">上櫃類股</div>
    </div>
    <div class="treemap" id="treemap">
        ${[...Array(22)].map(()=>`<div class="s-cell skel" style="height:76px;flex-grow:1"></div>`).join('')}
    </div>
</div>

<!-- ③ 個股列表 -->
<div>
    <div class="sec-title">個股行情</div>
    <div class="tbl-wrap">
        <div class="tbl-top">
            <div class="tab-row" style="margin:0">
                <div class="tab on" id="tabAll"  onclick="setMktTab('all',this)">全部</div>
                <div class="tab"    id="tabTWSE" onclick="setMktTab('twse',this)">上市</div>
                <div class="tab"    id="tabTPEX" onclick="setMktTab('tpex',this)">上櫃</div>
            </div>
            <input class="search-in" id="q" type="text"
                   placeholder="代號或名稱…" oninput="onSearch()" autocomplete="off">
            <div class="sort-row">
                <button class="sort-btn on" onclick="setSort('pct',this)">漲跌幅 ▼</button>
                <button class="sort-btn" onclick="setSort('vol',this)">成交量 ▼</button>
                <button class="sort-btn" onclick="setSort('amp',this)">振幅 ▼</button>
                <button class="sort-btn" onclick="setSort('val',this)">成交金額 ▼</button>
                <button class="sort-btn" onclick="setSort('close',this)">股價 ▼</button>
            </div>
        </div>
        <div class="tbl-scroll">
            <table>
                <thead id="thead">
                    <tr>
                        <th data-k="code">代號<span class="arr">↕</span></th>
                        <th data-k="name">名稱<span class="arr">↕</span></th>
                        <th data-k="close" class="sorted">收盤<span class="arr">↕</span></th>
                        <th data-k="change">漲跌<span class="arr">↕</span></th>
                        <th data-k="pct">漲跌幅<span class="arr">↕</span></th>
                        <th data-k="open">開盤<span class="arr">↕</span></th>
                        <th data-k="high">最高<span class="arr">↕</span></th>
                        <th data-k="low">最低<span class="arr">↕</span></th>
                        <th data-k="amp">振幅<span class="arr">↕</span></th>
                        <th data-k="vol">成交量<span class="arr">↕</span></th>
                    </tr>
                </thead>
                <tbody id="tbody"><tr><td colspan="10" class="empty">載入中…</td></tr></tbody>
            </table>
        </div>
        <div class="tbl-foot">
            <span id="countTxt">—</span>
            <div style="display:flex;gap:6px;align-items:center">
                <button class="pg-btn" id="pgPrev" onclick="changePg(-1)">‹ 上頁</button>
                <span id="pgTxt" style="font-size:12px"></span>
                <button class="pg-btn" id="pgNext" onclick="changePg(1)">下頁 ›</button>
            </div>
        </div>
    </div>
</div>

</div><!-- /wrap -->

<script>
// ══════════════════════════════════════════════════
//  Config
// ══════════════════════════════════════════════════
const TWSE = 'https://openapi.twse.com.tw/v1';
const TPEX = 'https://www.tpex.org.tw/openapi/v1';
const PAGE = 60;

// ══════════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════════
let allStocks   = [];          // combined TWSE+TPEX
let twseSectors = [];
let tpexSectors = [];
let mktFilter   = 'all';
let sortKey     = 'pct';
let sortDir     = -1;          // -1 desc  1 asc
let searchQ     = '';
let page        = 0;
let hmTab       = 'twse';

// ══════════════════════════════════════════════════
//  Helpers
// ══════════════════════════════════════════════════
const n  = s => { if(!s||s==='--'||s==='N/A'||s==='') return NaN; return parseFloat(String(s).replace(/,/g,'')); };
const f  = (v,d=2)=> isNaN(v)?'--':v.toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d});
const fv = v => { if(isNaN(v)||v<=0) return '--'; if(v>=1e8) return (v/1e8).toFixed(2)+'億'; if(v>=1e4) return (v/1e4).toFixed(0)+'萬'; return v.toLocaleString(); };
const sg = v => v>=0?'+':'';

// heat colour: -10%→red, 0→dark, +10%→green
function hc(p){
    const t=Math.max(-10,Math.min(10,p));
    if(t===0) return '#252c36';
    if(t>0){const r=t/10;return `rgb(${~~(25*(1-r))},${~~(55+145*r)},${~~(25*(1-r))})`}
    const r=-t/10;return `rgb(${~~(80+155*r)},${~~(25*(1-r))},${~~(25*(1-r))})`;
}

// ══════════════════════════════════════════════════
//  Fetch
// ══════════════════════════════════════════════════
async function api(url){
    const r=await fetch(url);
    if(!r.ok) throw new Error(r.status+' '+url);
    return r.json();
}

// ══════════════════════════════════════════════════
//  Parse
// ══════════════════════════════════════════════════
function parseTWSE(raw){
    return raw
        .filter(s=> /^\d{4,6}[A-Z]?$/.test(s.Code??s['證券代號']??''))
        .map(s=>{
            const close  = n(s.ClosingPrice  ?? s['收盤價']);
            const chg    = n(s.Change         ?? s['漲跌價差']);
            const prev   = close-chg;
            const pct    = (prev&&!isNaN(chg))? chg/prev*100 : NaN;
            const high   = n(s.HighestPrice   ?? s['最高價']);
            const low    = n(s.LowestPrice    ?? s['最低價']);
            const amp    = (prev&&!isNaN(high)&&!isNaN(low))? (high-low)/prev*100 : NaN;
            return {
                code:s.Code??s['證券代號'], name:s.Name??s['證券名稱'],
                mkt:'twse',
                open:n(s.OpeningPrice??s['開盤價']), high, low, close,
                change:chg, pct, amp,
                vol:n(s.TradeVolume??s['成交股數']),
                val:n(s.TradeValue ??s['成交金額']),
            };
        })
        .filter(s=>!isNaN(s.close)&&s.close>0);
}

function parseTPEX(raw){
    // TPEX field names differ
    return raw
        .filter(s=> /^\d{4,6}$/.test(
            s.SecuritiesCompanyCode??s.Code??s['代號']??''))
        .map(s=>{
            const code  = s.SecuritiesCompanyCode??s.Code??s['代號'];
            const name  = s.CompanyName??s.Name??s['名稱'];
            const close = n(s.Close??s.ClosingPrice??s['收盤']);
            const chg   = n(s.Change??s['漲跌']);
            const prev  = close-chg;
            const pct   = (prev&&!isNaN(chg))? chg/prev*100 : NaN;
            const high  = n(s.High??s.HighestPrice??s['最高']);
            const low   = n(s.Low ??s.LowestPrice ??s['最低']);
            const amp   = (prev&&!isNaN(high)&&!isNaN(low))? (high-low)/prev*100 : NaN;
            return {
                code, name, mkt:'tpex',
                open:n(s.Open??s.OpeningPrice??s['開盤']), high, low, close,
                change:chg, pct, amp,
                vol:n(s.Volumn??s.Volume??s.TradeVolume??s['成交量']),
                val:n(s.TradeValue??s['成交金額']),
            };
        })
        .filter(s=>!isNaN(s.close)&&s.close>0);
}

function parseSector(raw, pctKey){
    return raw.map(r=>{
        const name = r.Name??r['類股名稱']??r['指數名稱']??'';
        const idx  = n(r.Index??r['指數']??r.ClosePrice??r['收盤']);
        let pct    = n(r[pctKey]??r.ChangePer??r.ChangePercent??r['漲跌百分比']??r['漲跌(%)']??r['ChgPer']);
        if(isNaN(pct)){
            const chg=n(r.Change??r['漲跌']);
            const prev=idx-chg;
            if(prev) pct=chg/prev*100;
        }
        const vol=n(r.TradeValue??r['成交金額']??r.Volume??1e9);
        return {name,idx,pct,vol:isNaN(vol)?1e9:vol};
    }).filter(r=>r.name&&!isNaN(r.pct));
}

// ══════════════════════════════════════════════════
//  Render: overview cards
// ══════════════════════════════════════════════════
function renderCards(indexRows){
    const row=indexRows.find(r=>{
        const n=(r.Index??r['指數']??r.Name??'').toString();
        return /加權|TSE Weighted|TAIEX/i.test(n);
    })??indexRows[0]??{};

    const idx    = n(row.Index??row['指數']??row.ClosePrice);
    const chg    = n(row.Change??row['漲跌']);
    const chgPct = n(row.ChangePer??row.ChangePercent??row['漲跌百分比']??row['漲跌(%)']);

    const twseStocks=allStocks.filter(s=>s.mkt==='twse');
    const tpexStocks=allStocks.filter(s=>s.mkt==='tpex');

    const breadth=(list)=>({
        up:list.filter(s=>s.change>0).length,
        dn:list.filter(s=>s.change<0).length,
        flat:list.filter(s=>s.change===0).length,
    });
    const tb=breadth(twseStocks), pb=breadth(tpexStocks);

    const cards=[
        {lbl:'加權指數',val:f(idx),cls:''},
        {lbl:'漲跌幅',  val:sg(chgPct)+f(chgPct)+'%', cls:chgPct>=0?'up':'down'},
        {lbl:'漲跌點數',val:sg(chg)+f(chg),          cls:chg>=0?'up':'down'},
        {lbl:'上市 上漲',val:tb.up+'',   cls:'up'},
        {lbl:'上市 下跌',val:tb.dn+'',   cls:'down'},
        {lbl:'上市 平盤',val:tb.flat+'', cls:'neu'},
        {lbl:'上櫃 上漲',val:pb.up+'',   cls:'up'},
        {lbl:'上櫃 下跌',val:pb.dn+'',   cls:'down'},
    ];

    document.getElementById('cards').innerHTML=cards.map(c=>`
        <div class="card">
            <div class="card-lbl">${c.lbl}</div>
            <div class="card-val ${c.cls}">${c.val}</div>
        </div>`).join('');
}

// ══════════════════════════════════════════════════
//  Render: treemap
// ══════════════════════════════════════════════════
function renderHeatmap(){
    const sectors=hmTab==='twse'?twseSectors:tpexSectors;
    const el=document.getElementById('treemap');
    if(!sectors.length){
        el.innerHTML='<div style="color:var(--txt2);padding:20px;font-size:12px">⚠️ 無類股資料（可能為非交易日）</div>';
        return;
    }
    const total=sectors.reduce((s,c)=>s+(c.vol||1),0);
    el.innerHTML=sectors.map(s=>{
        const grow=((s.vol||1)/total*100).toFixed(2);
        const sym=s.pct>=0?'▲':'▼';
        return `<div class="s-cell" style="background:${hc(s.pct)};flex-grow:${grow}" title="${s.name}">
            <div class="s-name">${s.name}</div>
            <div class="s-pct">${sym} ${Math.abs(s.pct).toFixed(2)}%</div>
            <div class="s-idx">${f(s.idx)}</div>
        </div>`;
    }).join('');
}

// ══════════════════════════════════════════════════
//  Render: stock table
// ══════════════════════════════════════════════════
function getFiltered(){
    let list=allStocks;
    if(mktFilter==='twse') list=list.filter(s=>s.mkt==='twse');
    if(mktFilter==='tpex') list=list.filter(s=>s.mkt==='tpex');
    const q=searchQ.toLowerCase();
    if(q) list=list.filter(s=>s.code.includes(q)||s.name.toLowerCase().includes(q));
    list=[...list].sort((a,b)=>{
        const av=isNaN(a[sortKey])?-Infinity:a[sortKey];
        const bv=isNaN(b[sortKey])?-Infinity:b[sortKey];
        if(typeof av==='string') return sortDir*(av>bv?1:-1);
        return sortDir*(bv-av);
    });
    return list;
}

function renderTable(){
    const list=getFiltered();
    const total=list.length;
    const maxPg=Math.ceil(total/PAGE)-1;
    if(page>maxPg) page=Math.max(0,maxPg);
    const slice=list.slice(page*PAGE,page*PAGE+PAGE);

    const pctBadge=(v)=>{
        if(isNaN(v)) return `<span class="badge neu">--</span>`;
        const cls=v>0?'up':v<0?'down':'neu';
        return `<span class="badge ${cls}">${sg(v)}${f(v)}%</span>`;
    };

    document.getElementById('countTxt').textContent=
        `共 ${total} 筆 (第 ${page+1}/${Math.ceil(total/PAGE)||1} 頁)`;
    document.getElementById('pgTxt').textContent=`第 ${page+1} / ${Math.ceil(total/PAGE)||1} 頁`;
    document.getElementById('pgPrev').disabled=page<=0;
    document.getElementById('pgNext').disabled=page>=maxPg;

    if(!slice.length){
        document.getElementById('tbody').innerHTML=
            `<tr><td colspan="10" class="empty">找不到符合條件的股票</td></tr>`;
        return;
    }

    document.getElementById('tbody').innerHTML=slice.map(s=>{
        const chgCls=s.change>0?'up':s.change<0?'down':'neu';
        return `<tr>
            <td><span class="code">${s.code}</span>
                <span class="mkt-tag ${s.mkt}">${s.mkt==='twse'?'上市':'上櫃'}</span>
            </td>
            <td><strong>${s.name}</strong></td>
            <td>${f(s.close)}</td>
            <td class="${chgCls}">${sg(s.change)}${f(s.change)}</td>
            <td>${pctBadge(s.pct)}</td>
            <td>${f(s.open)}</td>
            <td class="up">${f(s.high)}</td>
            <td class="down">${f(s.low)}</td>
            <td>${isNaN(s.amp)?'--':f(s.amp)+'%'}</td>
            <td>${fv(s.vol)}</td>
        </tr>`;
    }).join('');
}

// ══════════════════════════════════════════════════
//  Controls
// ══════════════════════════════════════════════════
function setHmTab(tab,el){
    hmTab=tab;
    document.querySelectorAll('#hmTabs .tab').forEach(t=>t.classList.remove('on'));
    el.classList.add('on');
    renderHeatmap();
}

function setMktTab(tab,el){
    mktFilter=tab; page=0;
    document.querySelectorAll('.tab-row .tab').forEach(t=>{
        if(t.id&&t.id.startsWith('tab')) t.classList.remove('on');
    });
    el.classList.add('on');
    renderTable();
}

function setSort(key,el){
    sortKey=key; page=0;
    document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('on'));
    el.classList.add('on');
    renderTable();
}

function onSearch(){
    searchQ=document.getElementById('q').value.trim(); page=0;
    renderTable();
}

function changePg(d){ page+=d; renderTable(); }

// header clicks for table columns
document.getElementById('thead').addEventListener('click',e=>{
    const th=e.target.closest('th');
    if(!th) return;
    const k=th.dataset.k;
    if(!k) return;
    sortDir= (sortKey===k)?-sortDir:-1;
    sortKey=k; page=0;
    document.querySelectorAll('th').forEach(t=>t.classList.remove('sorted'));
    th.classList.add('sorted');
    renderTable();
});

// ══════════════════════════════════════════════════
//  Status
// ══════════════════════════════════════════════════
function setStatus(ok){
    document.getElementById('dot').className='dot'+(ok?' live':'');
    const now=new Date().toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});
    document.getElementById('ts').textContent='更新 '+now;
}

// ══════════════════════════════════════════════════
//  Main load
// ══════════════════════════════════════════════════
async function loadAll(){
    const btn=document.getElementById('rfBtn');
    btn.disabled=true; btn.textContent='更新中…';

    try{
        const [twseR,tpexR,secTWSE,secTPEX,idxR]=await Promise.allSettled([
            api(`${TWSE}/exchangeReport/STOCK_DAY_ALL`),
            api(`${TPEX}/tpex_mainboard_daily_close_quotes`),
            api(`${TWSE}/exchangeReport/MI_INDEX20`),
            api(`${TPEX}/tpex_mainboard_index_quotes`),
            api(`${TWSE}/exchangeReport/MI_INDEX`),
        ]);

        // stocks
        const twseStocks=twseR.status==='fulfilled'&&Array.isArray(twseR.value)
            ? parseTWSE(twseR.value) : [];
        const tpexStocks=tpexR.status==='fulfilled'&&Array.isArray(tpexR.value)
            ? parseTPEX(tpexR.value) : [];
        allStocks=[...twseStocks,...tpexStocks];

        if(!twseStocks.length&&!tpexStocks.length){
            document.getElementById('tbody').innerHTML=
                '<tr><td colspan="10" class="empty">⚠️ 無交易資料（可能為假日或盤前）</td></tr>';
        } else {
            renderTable();
        }

        // sectors
        twseSectors=secTWSE.status==='fulfilled'&&Array.isArray(secTWSE.value)
            ? parseSector(secTWSE.value,'ChangePer') : [];
        tpexSectors=secTPEX.status==='fulfilled'&&Array.isArray(secTPEX.value)
            ? parseSector(secTPEX.value,'IndexChange') : [];
        renderHeatmap();

        // overview
        const idxRows=idxR.status==='fulfilled'&&Array.isArray(idxR.value)
            ? idxR.value : [];
        renderCards(idxRows);

        setStatus(true);

    } catch(e){
        console.error(e); setStatus(false);
    } finally{
        btn.disabled=false; btn.textContent='↻ 更新';
    }
}

// ══════════════════════════════════════════════════
//  Auto-refresh during trading hours
// ══════════════════════════════════════════════════
function checkHours(){
    const now=new Date();
    const tp=now.toLocaleString('en-US',{timeZone:'Asia/Taipei'});
    const tpDate=new Date(tp);
    const hm=tpDate.getHours()*60+tpDate.getMinutes();
    const wd=tpDate.getDay();
    const trading=wd>=1&&wd<=5&&hm>=9*60&&hm<=13*60+30;
    document.getElementById('notice').innerHTML=trading
        ? '🔴 <strong>交易進行中</strong>（09:00–13:30）— 每 3 分鐘自動更新'
        : '📊 資料來源：台灣證券交易所 TWSE + 櫃買中心 TPEX OpenAPI（盤後資料）';
    return trading;
}

async function loop(){
    await loadAll();
    if(checkHours()) setTimeout(loop,3*60*1000);
}

loop();
</script>
