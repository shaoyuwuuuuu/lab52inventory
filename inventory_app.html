<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab52 庫存系統</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F0E8;--bg2:#FDFAF5;--bg3:#EDE8DF;
  --border:#DDD8CE;--radius:8px;
  --text:#2C2416;--text2:#5C5448;--text3:#8C8070;
  --accent:#2D5016;--accent-l:#E8EFE0;
  --ok-bg:#DDE8D0;--ok-text:#2D5016;
  --warn-bg:#EDE0C4;--warn-text:#7A5C1E;
  --danger-bg:#E8D5D0;--danger-text:#8B2E2E;
  --low-bg:#F5DDD0;--low-text:#7A3A1E;
}
*,*::before,*::after{box-sizing:border-box}
*{font-variant-numeric:tabular-nums}
body{background:var(--bg3);color:var(--text);font-family:system-ui,sans-serif;margin:0;min-height:100vh}

/* ── Topbar ──────────────────────────────────────────── */
.topbar{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 28px;overflow:visible}
.topbar-inner{display:flex;align-items:center;height:64px;min-height:64px;max-height:64px;padding:0;gap:16px;max-width:1400px;margin:0 auto;overflow:visible}
.brand{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--accent);white-space:nowrap;display:flex;align-items:center;gap:8px;flex-shrink:0}
.nav-tabs-bar{display:flex;height:100%;gap:0;margin-left:4px;overflow-x:auto;scrollbar-width:none;flex-shrink:1}
.nav-tabs-bar::-webkit-scrollbar{display:none}
.nav-tab{height:100%;padding:0 15px;font-size:17px;font-weight:700;cursor:pointer;border:none;background:none;color:var(--text3);border-bottom:3px solid transparent;font-family:system-ui,sans-serif;display:flex;align-items:center;transition:color .15s;white-space:nowrap;flex-shrink:0}
.nav-tab:hover{color:var(--text2)}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.topbar-search{position:relative;display:flex;align-items:center;margin-left:auto}
.topbar-search i{position:absolute;left:9px;color:var(--text3);font-size:.82rem;pointer-events:none}
.topbar-search input{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:5px 12px 5px 28px;font-size:.8rem;color:var(--text);width:180px;outline:none;transition:border-color .15s,width .2s}
.topbar-search input:focus{border-color:var(--accent);background:var(--bg2);width:220px}
.topbar-search input::placeholder{color:var(--text3)}
.topbar-right{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text3)}

/* ── Page ────────────────────────────────────────────── */
.page{max-width:1400px;margin:0 auto;padding:24px 28px}
.section{display:none}.section.active{display:block}

/* ── Page Title ──────────────────────────────────────── */
.page-title{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;color:var(--accent);margin-bottom:1.2rem}

/* ── Cards ───────────────────────────────────────────── */
.card{background:var(--bg2)!important;border:1px solid var(--border)!important;border-radius:var(--radius)!important;box-shadow:none!important}
.stat-card{border-top:3px solid!important;border-left:none!important}
.stat-card.blue  {border-top-color:var(--accent)!important}
.stat-card.green {border-top-color:#5C8A3C!important}
.stat-card.yellow{border-top-color:#B8761A!important}

/* ── Sync Bar ────────────────────────────────────────── */
.sync-bar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:.5rem 1rem;margin-bottom:1.2rem;font-size:.82rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;color:var(--text3)}

/* ── Buttons ─────────────────────────────────────────── */
.btn-primary{background:var(--accent)!important;border-color:var(--accent)!important;border-radius:6px!important;box-shadow:none!important;color:#fff!important}
.btn-primary:hover,.btn-primary:focus,.btn-primary:active{background:#234010!important;border-color:#234010!important;box-shadow:none!important}
.btn-outline-primary{color:var(--accent)!important;border-color:#C8C0B0!important;background:transparent!important;border-radius:6px!important;box-shadow:none!important}
.btn-outline-primary:hover{background:var(--accent-l)!important;color:var(--accent)!important;border-color:var(--accent)!important;box-shadow:none!important}
.btn-outline-secondary{color:var(--text2)!important;border-color:#C8C0B0!important;background:transparent!important;border-radius:6px!important;box-shadow:none!important}
.btn-outline-secondary:hover{background:var(--bg3)!important;color:var(--text)!important;box-shadow:none!important}
.btn-outline-danger{border-radius:6px!important;box-shadow:none!important;color:#C0392B!important;border-color:#DDB8B0!important}
.btn-outline-danger:hover{background:var(--danger-bg)!important;color:var(--danger-text)!important}
.btn-secondary{background:var(--bg3)!important;border-color:var(--border)!important;color:var(--text2)!important;border-radius:6px!important;box-shadow:none!important}
.btn-close{filter:none;opacity:.5}

/* ── Table ───────────────────────────────────────────── */
.table{--bs-table-bg:var(--bg2);--bs-table-hover-bg:var(--bg3)}
.table th{background:var(--bg3)!important;color:var(--text3)!important;font-size:11px!important;font-weight:600;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border)!important;border-right:none!important;border-top:none;overflow:visible;position:relative;text-align:left!important}
.table td{border-bottom:1px solid var(--border)!important;border-right:none!important;color:var(--text);text-align:left!important}
.table>thead>tr>th,.table>tbody>tr>td,.table>tfoot>tr>td{text-align:left!important}
.table tr:last-child td{border-bottom:none!important}
.table-hover tbody tr:hover td{background:var(--bg3)!important}
.table-responsive{border-radius:var(--radius);overflow-x:auto}

/* ── Batch expand ────────────────────────────────────── */
.batch-row{background:var(--bg3)!important}
.batch-row td{padding:.4rem .75rem}
.toggle-batches{cursor:pointer;user-select:none}
.batch-inner-table th,.batch-inner-table td{text-align:left!important}
.batch-inner-table td{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.batch-inner-table td:last-child{white-space:normal;overflow:visible;word-break:break-word}
/* ── Product detail expand ───────────────────────────── */
.prod-detail-table{table-layout:fixed;width:100%}
.prod-detail-table th{overflow:visible;white-space:nowrap;position:relative}
.prod-detail-table td{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.prod-detail-table td:last-child{white-space:normal;word-break:break-word}
/* ── Inline note edit ────────────────────────────────── */
.note-cell{display:block;min-width:30px;outline:none;border-radius:4px;padding:1px 4px;cursor:text;white-space:pre-wrap;word-break:break-word}
.note-cell:focus{background:var(--bg3);box-shadow:0 0 0 1.5px var(--accent)}
.note-cell:empty::before{content:'點擊填寫…';color:var(--text3);font-style:italic}
.col-resizer{position:absolute;right:-3px;top:0;width:7px;height:100%;cursor:col-resize;z-index:2;user-select:none}
.col-resizer:hover,.col-resizer.active{background:var(--accent);opacity:.35}

/* ── Badge overrides ─────────────────────────────────── */
.badge.bg-success{background:var(--ok-bg)!important;color:var(--ok-text)!important;font-weight:500;border:none}
.badge.bg-warning{background:var(--warn-bg)!important;color:var(--warn-text)!important;font-weight:500;border:none}
.badge.bg-danger {background:var(--danger-bg)!important;color:var(--danger-text)!important;font-weight:500;border:none}
.badge.bg-secondary{background:var(--bg3)!important;color:var(--text2)!important;border:1px solid var(--border);font-weight:500}
.badge.bg-light{background:var(--bg3)!important;color:var(--text2)!important;border:1px solid var(--border)!important}

/* ── Text / bg color overrides ───────────────────────── */
.text-primary{color:var(--accent)!important}
.text-success{color:#5C8A3C!important}
.text-warning{color:#B8761A!important}
.text-danger {color:#C0392B!important}
.text-muted  {color:var(--text3)!important}
.text-dark   {color:var(--text)!important}
.bg-success{background:var(--ok-bg)!important;color:var(--ok-text)!important}
.bg-warning{background:var(--warn-bg)!important;color:var(--warn-text)!important}
.bg-danger {background:var(--danger-bg)!important;color:var(--danger-text)!important}
.bg-secondary{background:var(--bg3)!important;color:var(--text2)!important}
.bg-light  {background:var(--bg3)!important;color:var(--text2)!important}
.border{border-color:var(--border)!important}
.border-bottom{border-bottom-color:var(--border)!important}
.border-top{border-top-color:var(--border)!important}
.small{color:var(--text3)}

/* ── Movement badges ─────────────────────────────────── */
.movement-badge{font-size:.75rem}
.mv-badge{display:inline-flex;align-items:center;padding:2px 6px;border-radius:5px;font-size:.72rem;font-weight:500;white-space:nowrap}
.badge-in-mv    {background:var(--ok-bg);color:var(--ok-text)}
.badge-out-fba  {background:#DDE8F0;color:#1E4A7A}
.badge-out-sale {background:#E8E0EF;color:#5A3070}
.badge-out-dmg  {background:var(--danger-bg);color:var(--danger-text)}
.badge-out-ret  {background:var(--low-bg);color:var(--low-text)}

/* ── Exp chip ────────────────────────────────────────── */
.exp-chip{display:inline-block;padding:1px 7px;border-radius:5px;font-size:.72rem;background:var(--bg2);border:1px solid var(--border);color:var(--text3);white-space:nowrap}
.exp-near{background:var(--warn-bg);border-color:#C8A850;color:var(--warn-text)}

/* ── Modal ───────────────────────────────────────────── */
.modal-content{background:var(--bg2)!important;border:1px solid var(--border)!important;border-radius:12px!important}
.modal-header{border-bottom:1px solid var(--border)!important;background:var(--bg2)}
.modal-footer{border-top:1px solid var(--border)!important;background:var(--bg2)}
.modal-title{font-family:'Playfair Display',serif;font-size:1.05rem!important;color:var(--accent)!important}
.form-control,.form-select{background:var(--bg)!important;border-color:var(--border)!important;color:var(--text)!important;border-radius:var(--radius)!important}
.form-control:focus,.form-select:focus{border-color:var(--accent)!important;box-shadow:0 0 0 2px rgba(45,80,22,.12)!important}
.form-label{color:var(--text2);font-size:.83rem}
.input-group-text{background:var(--bg3);border-color:var(--border);color:var(--text2)}
.optgroup{color:var(--text2)}

/* ── Toast ───────────────────────────────────────────── */
#toast-container{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;width:300px}
.toast-item{margin-top:.5rem;padding:.75rem 1rem;border-radius:var(--radius);font-size:.875rem;animation:fadeIn .2s}
.toast-success{background:var(--ok-bg);color:var(--ok-text);border:1px solid #B8D0A0}
.toast-error  {background:var(--danger-bg);color:var(--danger-text);border:1px solid #D0A8A0}
.toast-info   {background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── Transit tags ────────────────────────────────────── */
.transit-tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:.7rem;font-weight:600;white-space:nowrap;background:#DDE8F0;color:#1E4A7A;margin-left:4px}
.transit-tag.tw{background:var(--warn-bg);color:var(--warn-text)}

/* ── Action badges ───────────────────────────────────── */
.action-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:600;white-space:nowrap}
.action-badge.red  {background:var(--danger-bg);color:var(--danger-text)}
.action-badge.amber{background:var(--warn-bg);color:var(--warn-text)}
.action-badge.green{background:var(--ok-bg);color:var(--ok-text)}

/* ── Topbar sync button ──────────────────────────────── */
.btn-topbar-sync{font-size:.78rem;padding:3px 10px;border-radius:5px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text2);line-height:1.4;transition:background .15s,border-color .15s,color .15s}
.btn-topbar-sync:hover{background:var(--accent-l);border-color:var(--accent);color:var(--accent)}

/* ── Product action hover ────────────────────────────── */
.prod-actions{opacity:0;transition:opacity .15s;white-space:nowrap}
tr:hover .prod-actions{opacity:1}

/* ── Stat card transit ───────────────────────────────── */
.stat-card.purple{border-top-color:#6B5ECD!important}

/* ── Column resize ───────────────────────────────────── */
.col-rz{position:absolute;right:-4px;top:0;width:8px;height:100%;cursor:col-resize;user-select:none;z-index:20;touch-action:none}
.col-rz::after{content:'';position:absolute;left:3px;top:15%;width:2px;height:70%;background:var(--border);border-radius:1px;transition:background .15s}
.col-rz:hover::after,.col-rz.dragging::after{background:var(--accent)}
.col-rz:hover,.col-rz.dragging{background:rgba(45,80,22,.08)}

/* ── Month Picker ────────────────────────────────────── */
.mpanel{position:absolute;top:calc(100% + 6px);left:0;z-index:300;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.13);min-width:272px}
.mpanel-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mpanel-nav button{background:none;border:1px solid var(--border);border-radius:6px;width:28px;height:28px;cursor:pointer;color:var(--text2);font-size:.9rem;line-height:1}
.mpanel-nav button:hover{background:var(--bg3)}
.mpanel-nav .clear-btn{width:auto;padding:0 10px;font-size:.75rem;color:var(--text3);border-color:var(--border)}
.mpanel-months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mmon{border:1px solid var(--border);border-radius:8px;padding:8px 4px;font-size:.82rem;cursor:pointer;color:var(--text2);background:none;transition:all .12s;font-family:system-ui,sans-serif;text-align:center}
.mmon:hover{background:var(--accent-l);border-color:var(--accent);color:var(--accent)}
.mmon.selected{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important;font-weight:700}
.mmon.has-data{border-color:#B0C890}
.mmon.no-data{opacity:.35;cursor:default}
.mmon.no-data:hover{background:none;border-color:var(--border);color:var(--text2)}
.mpicker-btn{background:var(--bg)!important;border:1px solid var(--border)!important;border-radius:8px!important;padding:5px 14px!important;font-size:.85rem;color:var(--text2)!important;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;min-width:150px}
.mpicker-btn:hover,.mpicker-btn.on{border-color:var(--accent)!important;color:var(--accent)!important}
.mpicker-btn.on{background:var(--accent-l)!important;font-weight:600}</style>
</head>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ── State ─────────────────────────────────────────────────────────────────────
var S = { products:[], movements:[], taiwan:[], billing:[], transits:[] };
var GAS_MODE = (typeof google !== 'undefined' && typeof google.script !== 'undefined');
var GAS_URL  = localStorage.getItem('lab52_gas_url') || '';
var _modals  = {};
// Shared column widths (%) for all batch inner tables — dragging one syncs all
var _batchColPcts = [11, 13, 8, 10, 12, 10, 36];

// ── Navigation ────────────────────────────────────────────────────────────────
function showSection(name) {
  document.querySelectorAll('.section').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.nav-tab').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('section-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
  localStorage.setItem('lab52_tab', name);
}

function restoreTab() {
  var tab = localStorage.getItem('lab52_tab');
  if (!tab) return;
  var sec = document.getElementById('section-' + tab);
  if (!sec) return;
  document.querySelectorAll('.section').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.nav-tab').forEach(function(el) { el.classList.remove('active'); });
  sec.classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(function(btn) {
    if (btn.getAttribute('onclick') && btn.getAttribute('onclick').indexOf("'" + tab + "'") >= 0) {
      btn.classList.add('active');
    }
  });
}

// ── GAS Bridge ────────────────────────────────────────────────────────────────
function gasCall(fnName, args, onOk, onFail) {
  if (GAS_MODE) {
    var runner = google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.error) { showToast('錯誤：' + r.error, 'error'); if (onFail) onFail(r.error); }
        else if (onOk) onOk(r);
      })
      .withFailureHandler(function(e) {
        showToast('執行失敗：' + (e.message||e), 'error');
        if (onFail) onFail(e);
      });
    if (args !== undefined) runner[fnName](args);
    else runner[fnName]();
  } else {
    showToast('寫入功能需從 GAS 部署連結開啟', 'info');
    if (onFail) onFail('local mode');
  }
}

function gasCall2(fnName, a1, a2, onOk, onFail) {
  if (GAS_MODE) {
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.error) { showToast('錯誤：' + r.error, 'error'); if (onFail) onFail(r.error); }
        else if (onOk) onOk(r);
      })
      .withFailureHandler(function(e) {
        showToast('執行失敗：' + (e.message||e), 'error');
        if (onFail) onFail(e);
      })[fnName](a1, a2);
  } else {
    showToast('寫入功能需從 GAS 部署連結開啟', 'info');
    if (onFail) onFail('local mode');
  }
}

// ── Sync / Load Data ──────────────────────────────────────────────────────────
function syncData() {
  if (GAS_MODE) {
    google.script.run
      .withSuccessHandler(applyData)
      .withFailureHandler(function(e) { showToast('同步失敗：' + e.message, 'error'); })
      .getAllData();
  } else if (GAS_URL) {
    var cb = 'lab52cb_' + Date.now();
    window[cb] = function(data) {
      applyData(data);
      delete window[cb];
      var s = document.getElementById('_jsonp');
      if (s) s.remove();
    };
    var script = document.createElement('script');
    script.id  = '_jsonp';
    script.src = GAS_URL + '?action=getData&callback=' + cb;
    script.onerror = function() { showToast('同步失敗，請確認 GAS URL', 'error'); };
    document.body.appendChild(script);
  } else {
    // Try to load from localStorage cache
    var cache = localStorage.getItem('lab52_cache');
    if (cache) {
      applyData(JSON.parse(cache));
      showToast('載入本機快取', 'info');
    } else {
      showToast('請設定 GAS URL 以同步資料', 'info');
    }
  }
}

function applyData(data) {
  function toArr(v) { return Array.isArray(v) ? v : (v && v.rows ? v.rows : []); }
  if (data.products  !== undefined) S.products  = toArr(data.products);
  if (data.movements !== undefined) S.movements = toArr(data.movements);
  if (data.taiwan    !== undefined) S.taiwan    = toArr(data.taiwan);
  if (data.billing   !== undefined) S.billing   = toArr(data.billing);
  if (data.transits  !== undefined) S.transits  = toArr(data.transits);
  localStorage.setItem('lab52_cache', JSON.stringify(S));
  var t = new Date().toLocaleTimeString('zh-TW');
  document.getElementById('sync-status').textContent = '已同步 ' + t;
  renderAll();
  showToast('資料已同步', 'success');
}

// ── Transit Helpers ───────────────────────────────────────────────────────────
function renderTransitTag(p) {
  var fbaQty = (p.transitFBA && p.transitFBA.qty) || 0;
  var twQty  = (p.transitTW  && p.transitTW.qty)  || 0;
  var tags   = '';
  if (fbaQty > 0) {
    var eta = p.transitFBA.eta ? ' ETA ' + p.transitFBA.eta : '';
    tags += '<span class="transit-tag">+' + fbaQty + ' 往FBA' + eta + '</span>';
  }
  if (twQty > 0) {
    var etaTW = p.transitTW.eta ? ' ETA ' + p.transitTW.eta : '';
    tags += '<span class="transit-tag tw">+' + twQty + ' 往海外倉' + etaTW + '</span>';
  }
  return tags;
}

function getActionStatus(stock, inTransit) {
  if (stock === 0 && inTransit > 0) return { label: '在途中', color: 'green' };
  if (stock === 0 && inTransit === 0) return { label: '需補貨', color: 'red' };
  if (stock < 10  && inTransit > 0)  return { label: '注意',   color: 'amber' };
  return null;
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderAll() {
  renderDashboard();
  renderProducts();
  renderTaiwan();
  renderBilling();
}

function fmtExp(s) {
  if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  var _m = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
  var mf = s.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{1,2})\s+(\d{4})/);
  if (mf) { var mo=_m[mf[1]],dy=+mf[2],yr=+mf[3]; return yr+'-'+(mo<10?'0':'')+mo+'-'+(dy<10?'0':'')+dy; }
  return s.slice(0,10);
}

function fmtBoxes(boxes, qpc) {
  if (!boxes && boxes !== 0) return '—';
  var b = parseFloat(boxes);
  if (b === 0) return '—';
  var q = parseFloat(qpc) || 1;
  var sign = b < 0 ? '-' : '';
  var abs = Math.abs(b);
  var pcs = Math.round(abs * q);
  if (abs < 1) return sign + pcs + ' pcs (' + abs.toFixed(2) + '箱)';
  return sign + abs.toFixed(1) + ' 箱';
}

function renderTaiwan() {
  // Collect TW movements per EAN from dedicated taiwan array
  var movsByEan = {};
  S.taiwan.forEach(function(m) {
    var ean = m.ean || ''; if (!ean) return;
    if (!movsByEan[ean]) movsByEan[ean] = [];
    movsByEan[ean].push(m);
  });

  var rows = S.products.map(function(p) {
    var mvs = movsByEan[p.ean] || [];
    var tw = mvs.reduce(function(s, m) { return s + (parseFloat(m.boxes) || 0); }, 0);
    var qpc = parseFloat(p.qty_per_carton) || 1;
    var pcs = Math.round(tw * qpc);
    var exp = mvs.map(function(m) { return m.exp_date || ''; }).filter(Boolean).sort()[0] || '';
    return { p: p, tw: tw, pcs: pcs, exp: exp, mvs: mvs, qpc: qpc };
  }).filter(function(r) { return r.tw > 0 || S.products.length < 20; });

  var html = '';
  if (rows.length === 0) {
    html = '<tr><td colspan="8" class="text-center text-muted py-4">目前無台灣倉庫存資料<br><small>點右上角「新增異動」或「匯入庫存 XLS」來新增</small></td></tr>';
  } else {
    rows.forEach(function(r) {
      var uid = 'tw_' + r.p.ean;
      var badge = r.tw <= 0 ? '<span class="badge bg-secondary">無庫存</span>'
                : r.tw < 5  ? '<span class="badge bg-warning">庫存低</span>'
                :              '<span class="badge bg-success">正常</span>';

      html += '<tr style="cursor:pointer" onclick="toggleProdDetail(\'' + uid + '\')">'
        + '<td><span class="fw-semibold">' + escHtml(r.p.name) + '</span></td>'
        + '<td><span class="text-muted" style="font-size:.82rem;">' + escHtml(r.p.sku) + '</span></td>'
        + '<td style="font-size:.78rem;font-family:monospace;color:var(--text2)">' + escHtml(r.p.ean) + '</td>'
        + '<td class="text-center fw-semibold">' + (r.tw !== 0 ? fmtBoxes(r.tw, r.qpc) : '—') + '</td>'
        + '<td class="text-center">' + (r.pcs > 0 ? r.pcs.toLocaleString() : '—') + '</td>'
        + '<td>' + (fmtExp(r.exp) || '—') + '</td>'
        + '<td>' + badge + '</td>'
        + '<td class="pe-2"><button class="btn btn-xs btn-outline-secondary" style="font-size:.72rem;"'
        + ' onclick="event.stopPropagation();openTwMovementModal(\'' + r.p.ean + '\')">異動</button></td>'
        + '</tr>';

      // Build running balance (oldest→newest accumulate, then reverse for display)
      var sorted = r.mvs.slice().sort(function(a, b) {
        return (a.date || '') < (b.date || '') ? -1 : 1;
      });
      var cum = 0;
      var pairs = sorted.map(function(m) {
        cum += parseFloat(m.boxes) || 0;
        return { m: m, bal: cum };
      });
      pairs.reverse();

      var detHtml = '<div class="px-3 py-2"><table id="det-' + uid + '" class="table table-sm mb-0" style="table-layout:fixed;width:100%;">'
        + '<colgroup>'
        + '<col style="width:13%"><col style="width:13%"><col style="width:12%">'
        + '<col style="width:18%"><col style="width:18%"><col style="width:26%">'
        + '</colgroup>'
        + '<thead><tr>'
        + '<th>異動時間</th><th>異動類型</th><th>數量變動</th>'
        + '<th>結餘庫存</th><th>效期</th><th>備注</th>'
        + '</tr></thead><tbody>';

      if (pairs.length === 0) {
        detHtml += '<tr><td colspan="6" class="text-muted text-center py-2">暫無異動紀錄</td></tr>';
      } else {
        pairs.forEach(function(pair) {
          var m = pair.m, boxes = parseFloat(m.boxes) || 0, bal = pair.bal;
          var prefix = boxes >= 0 ? '+' : '';
          var qtyStr = prefix + fmtBoxes(boxes, r.qpc);
          var qtyColor = boxes >= 0 ? 'color:var(--ok-text);font-weight:600' : 'color:#C0392B;font-weight:600';
          var balPcs = Math.round(bal * r.qpc);
          detHtml += '<tr style="font-size:.78rem;">'
            + '<td class="text-muted">' + escHtml(m.date || '') + '</td>'
            + '<td>' + inferMvType(m) + '</td>'
            + '<td style="' + qtyColor + '">' + qtyStr + '</td>'
            + '<td><span class="fw-semibold">' + fmtBoxes(bal, r.qpc) + '</span>'
            + (balPcs > 0 ? '<br><small class="text-muted">≈' + balPcs.toLocaleString() + ' pcs</small>' : '') + '</td>'
            + '<td><small class="text-muted">' + (fmtExp(m.exp_date) || '—') + '</small></td>'
            + '<td><span class="note-cell" contenteditable="true" data-ridx="' + (m.row_idx || '') + '" data-source="tw"'
            + ' onblur="saveNoteInline(this)"'
            + ' onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();this.blur()}">'
            + escHtml(m.note || '') + '</span></td>'
            + '</tr>';
        });
      }
      detHtml += '</tbody></table></div>';

      html += '<tr id="' + uid + '" style="display:none">'
        + '<td colspan="8" style="padding:0;background:var(--bg2)">' + detHtml + '</td></tr>';
    });
  }
  document.getElementById('taiwan-tbody').innerHTML = html;
  makeResizable('taiwan-table');
}

function renderDashboard() {
  // Per-EAN stock: overseas from movements, TW from dedicated taiwan array
  var stockByEan = {};
  S.movements.forEach(function(m) {
    var ean = m.ean || ''; if (!ean) return;
    if (!stockByEan[ean]) stockByEan[ean] = { TW:0, AMZLGS:0 };
    stockByEan[ean].AMZLGS += parseFloat(m.boxes) || 0;
  });
  S.taiwan.forEach(function(m) {
    var ean = m.ean || ''; if (!ean) return;
    if (!stockByEan[ean]) stockByEan[ean] = { TW:0, AMZLGS:0 };
    stockByEan[ean].TW += parseFloat(m.boxes) || 0;
  });

  // In-transit by EAN
  var transitByEan = {};
  S.transits.filter(function(t){ return t.status === 'TRANSIT'; }).forEach(function(t) {
    var ean = t.ean || '';
    if (!ean) return;
    transitByEan[ean] = (transitByEan[ean] || 0) + (parseFloat(t.qty_cartons) || 0);
  });

  function fmtQ(n) {
    n = Math.round(n * 10) / 10;
    return n > 0 ? '<span class="fw-semibold">' + n.toFixed(1) + '</span>'
                 : '<span class="text-muted">—</span>';
  }

  var tHtml = '<div class="table-responsive"><table class="table table-hover mb-0"><thead><tr>'
    + '<th>產品</th>'
    + '<th>台灣倉</th>'
    + '<th>外倉</th>'
    + '<th style="color:#1E7BC4">在途</th>'
    + '<th>狀態</th></tr></thead><tbody>';
  if (S.products.length === 0) {
    tHtml += '<tr><td colspan="5" class="text-muted text-center py-3">尚無產品資料</td></tr>';
  } else {
    tHtml += S.products.map(function(p) {
      var st  = stockByEan[p.ean] || { TW:0, AMZLGS:0 };
      var tw  = Math.round(st.TW * 10) / 10;
      var amz = Math.round(st.AMZLGS * 10) / 10;
      // Fallback to formula-computed boxes from sheet if no movement matched
      if (tw === 0 && amz === 0 && (p.boxes || 0) > 0) {
        amz = Math.round((p.boxes || 0) * 10) / 10;
      }
      var tr  = Math.round((transitByEan[p.ean] || 0) * 10) / 10;
      var badge = (amz <= 0 && tw <= 0)
        ? '<span class="badge bg-danger">需補貨</span>'
        : amz <= 5
          ? '<span class="badge bg-warning">偏低</span>'
          : '<span class="badge bg-success">正常</span>';
      return '<tr>'
        + '<td><span class="fw-bold">' + escHtml(p.name || '') + '</span>'
        + (p.sku ? '<br><small class="text-muted">' + escHtml(p.sku) + '</small>' : '')
        + '</td>'
        + '<td>' + fmtQ(tw) + '</td>'
        + '<td>' + fmtQ(amz) + '</td>'
        + '<td>'
        + (tr > 0 ? '<span style="color:#1E7BC4;font-weight:600">' + tr.toFixed(1) + '</span>'
                  : '<span class="text-muted">—</span>')
        + '</td>'
        + '<td>' + badge + '</td></tr>';
    }).join('');
  }
  tHtml += '</tbody></table></div>';
  document.getElementById('product-stock-overview').innerHTML = tHtml;

  // Active transits
  var activeT = S.transits.filter(function(t){ return t.status === 'TRANSIT'; });
  var twrap = document.getElementById('active-transits-wrap');
  if (twrap) {
    if (!activeT.length) {
      twrap.style.display = 'none';
    } else {
      twrap.style.display = '';
      var today0 = new Date().toISOString().slice(0,10);
      document.getElementById('active-transits-list').innerHTML = activeT.map(function(t) {
        var overdue = t.eta_date && t.eta_date < today0;
        return '<div class="d-flex align-items-center justify-content-between border-bottom px-3 py-2 gap-2">'
          + '<div style="flex:1;min-width:0">'
          + '<span class="fw-semibold" style="font-size:.85rem">' + escHtml(t.product_name || t.ean || '?') + '</span>'
          + ' <span class="text-muted" style="font-size:.75rem">&#8594; ' + escHtml(t.to_location || '')
          + ' | ' + parseFloat(t.qty_cartons).toFixed(1) + ' 箱'
          + (t.eta_date ? ' | ETA ' + t.eta_date : '') + '</span>'
          + (overdue ? ' <span class="badge bg-danger ms-1" style="font-size:.65rem">逾期</span>' : '')
          + '</div>'
          + '<button class="btn btn-sm btn-outline-primary py-0" style="font-size:.75rem;white-space:nowrap" onclick="openArrivalModal(' + t.id + ')">確認到貨</button>'
          + '</div>';
      }).join('');
    }
  }

  // Recent movements (last 15)
  var recentMoves = S.movements.slice().sort(function(a,b) {
    return (b.date||'') < (a.date||'') ? -1 : (b.date||'') > (a.date||'') ? 1 : 0;
  }).slice(0, 15);
  var movHtml = recentMoves.length === 0
    ? '<p class="text-muted small mb-0">尚無異動記錄</p>'
    : recentMoves.map(function(m) {
        var boxes = parseFloat(m.boxes) || 0;
        var badgeCls = boxes >= 0 ? 'bg-success' : 'bg-danger';
        var locLabel = m.location ? ' [' + m.location + ']' : '';
        return '<div class="d-flex justify-content-between align-items-start border-bottom py-2">'
          + '<div><div class="small fw-bold">' + escHtml(m.name || m.ean || '?') + '</div>'
          + '<div class="text-muted" style="font-size:.75rem;">' + (m.date||'') + locLabel + '</div></div>'
          + '<span class="badge movement-badge ' + badgeCls + ' ms-2">' + (boxes >= 0 ? '+' : '') + boxes.toFixed(1) + ' 箱</span>'
          + '</div>';
      }).join('');
  document.getElementById('recent-moves').innerHTML = movHtml;

  // Action items: products with low or zero stock
  var actionEl = document.getElementById('action-items');
  if (actionEl) {
    var actionItems = S.products.filter(function(p) {
      var st = stockByEan[p.ean] || { TW:0, AMZLGS:0 };
      return (st.TW + st.AMZLGS) <= 5;
    }).map(function(p) {
      var st = stockByEan[p.ean] || { TW:0, AMZLGS:0 };
      var total = Math.round((st.TW + st.AMZLGS) * 10) / 10;
      var inTransit = Math.round((transitByEan[p.ean] || 0) * 10) / 10;
      var status = total <= 0 ? { label:'需補貨', color:'red' }
                 : inTransit > 0 ? { label:'注意', color:'amber' }
                 : { label:'偏低', color:'amber' };
      return { p: p, total: total, inTransit: inTransit, status: status };
    });
    actionEl.innerHTML = actionItems.length === 0
      ? '<span class="text-muted small">無待處理項目</span>'
      : actionItems.map(function(item) {
          return '<div class="d-flex align-items-center justify-content-between border-bottom py-2" style="gap:8px">'
            + '<div style="flex:1;min-width:0">'
            + '<span class="fw-bold" style="font-size:.83rem">' + escHtml(item.p.name || '') + '</span>'
            + '<span class="text-muted" style="font-size:.72rem;margin-left:6px">在倉 ' + item.total.toFixed(1) + ' 箱</span>'
            + (item.inTransit > 0 ? ' <span class="transit-tag">+' + item.inTransit.toFixed(1) + ' 在途</span>' : '')
            + '</div>'
            + '<span class="action-badge ' + item.status.color + '">' + item.status.label + '</span>'
            + '</div>';
        }).join('');
  }

  // Expiring table (from movements + taiwan)
  var today = new Date(); today.setHours(0,0,0,0);
  var cutoff = new Date(today.getTime() + 180*24*60*60*1000);
  var expMap = {};
  S.movements.concat(S.taiwan).forEach(function(m) {
    if (!m.exp_date || !m.ean) return;
    var key = m.ean + '|' + m.exp_date;
    expMap[key] = (expMap[key] || 0) + (parseFloat(m.boxes) || 0);
  });
  var expiring = Object.keys(expMap).filter(function(k) {
    var parts = k.split('|'), expDate = parts[1];
    var qty = expMap[k];
    if (qty <= 0) return false;
    var d = new Date(expDate); d.setHours(0,0,0,0);
    return d <= cutoff;
  }).sort(function(a,b) {
    return a.split('|')[1] < b.split('|')[1] ? -1 : 1;
  }).slice(0, 10);

  var expHtml = expiring.length === 0
    ? '<p class="text-muted small mb-0">無即將到期批次</p>'
    : '<table class="table table-sm table-hover mb-0"><thead><tr><th>產品</th><th>EXP</th><th>剩餘天數</th><th>箱數</th></tr></thead><tbody>'
      + expiring.map(function(k) {
          var parts = k.split('|'), ean = parts[0], expDate = parts[1];
          var qty = expMap[k];
          var p = S.products.find(function(x){ return x.ean === ean; }) || {};
          var days = Math.round((new Date(expDate) - today) / (24*60*60*1000));
          var badge = days <= 30 ? 'bg-danger' : days <= 90 ? 'bg-warning text-dark' : 'bg-secondary';
          var pcs = p.qty_per_carton ? ' <small class="text-muted">(≈'+Math.round(qty*p.qty_per_carton)+'pcs)</small>' : '';
          return '<tr><td>' + escHtml(p.name || ean) + '</td>'
            + '<td>' + expDate + '</td>'
            + '<td><span class="badge ' + badge + '">' + days + ' 天</span></td>'
            + '<td>' + qty.toFixed(1) + ' 箱' + pcs + '</td></tr>';
        }).join('')
      + '</tbody></table>';
  document.getElementById('expiring-table').innerHTML = expHtml;
}


function renderProducts() {
  var dateFrom  = _dateFrom;
  var dateTo    = _dateTo;
  var hasFilter = !!(dateFrom || dateTo);
  function inRange(d) {
    if (!d) return false;
    if (dateFrom && d < dateFrom) return false;
    if (dateTo   && d > dateTo)   return false;
    return true;
  }
  document.getElementById('th-monthly-inout').style.display = hasFilter ? '' : 'none';

  // Build stock and movement maps by EAN (外倉 only — TW excluded here)
  var stockByEan = {};
  var movByEan = {};
  S.movements.forEach(function(m) {
    var ean = m.ean || '';
    if (!ean) return;
    var qty = parseFloat(m.boxes) || 0;
    var loc = (m.location || 'AMZLGS').toUpperCase();
    if (loc !== 'TW') {
      stockByEan[ean] = (stockByEan[ean] || 0) + qty;
    }
    if (!movByEan[ean]) movByEan[ean] = [];
    movByEan[ean].push(m);
  });

  var chipsEl = document.getElementById('products-month-chips');
  if (hasFilter) {
    var tIn = 0, tOut = 0;
    S.movements.forEach(function(m) {
      if (!inRange(m.date || '')) return;
      var q = parseFloat(m.boxes)||0;
      if (q > 0) tIn += q; else tOut += q;
    });
    chipsEl.innerHTML =
      '<span class="badge" style="background:var(--ok-bg);color:var(--ok-text);border:1px solid #B8D0A0;font-size:.78rem;">入庫 +'+tIn.toFixed(1)+' 箱</span>'
      +'<span class="badge" style="background:var(--danger-bg);color:var(--danger-text);border:1px solid #D0A8A0;font-size:.78rem;">出庫 '+tOut.toFixed(1)+' 箱</span>'
      +'<span class="badge bg-secondary" style="font-size:.78rem;">淨 '+(tIn+tOut>=0?'+':'')+(tIn+tOut).toFixed(1)+' 箱</span>';
  } else {
    chipsEl.innerHTML = '';
  }

  // Search filter
  var searchQ = (document.getElementById('prod-search') ? document.getElementById('prod-search').value.trim().toLowerCase() : '');

  var prodList = hasFilter
    ? S.products.filter(function(p) {
        return (movByEan[p.ean]||[]).some(function(m){ return inRange(m.date || ''); });
      })
    : S.products;

  if (searchQ) {
    prodList = prodList.filter(function(p) {
      return (p.name||'').toLowerCase().indexOf(searchQ) >= 0
          || (p.sku ||'').toLowerCase().indexOf(searchQ) >= 0
          || (p.ean ||'').toLowerCase().indexOf(searchQ) >= 0;
    });
  }

  var totalAmz = 0;

  var rows = prodList.map(function(p) {
    var amz = Math.round((stockByEan[p.ean] || 0) * 10) / 10;
    if (amz === 0 && (p.boxes || 0) > 0) amz = Math.round((p.boxes||0) * 10) / 10;
    totalAmz += amz;

    var rangeInQty = 0, rangeOutQty = 0;
    if (hasFilter) {
      (movByEan[p.ean]||[]).forEach(function(m) {
        if (!inRange(m.date || '')) return;
        var q = parseFloat(m.boxes)||0;
        if (q > 0) rangeInQty += q; else rangeOutQty += q;
      });
    }
    var rangeCell = hasFilter
      ? '<td>'
        +'<span style="color:var(--ok-text);font-weight:600;font-size:.82rem;">+'+rangeInQty.toFixed(1)+'</span>'
        +' / <span style="color:#C0392B;font-weight:600;font-size:.82rem;">'+rangeOutQty.toFixed(1)+'</span>'
        +'</td>'
      : '';

    // Compute running balance oldest→newest, then reverse for newest-first display
    var movesOldFirst = (movByEan[p.ean]||[]).slice().sort(function(a,b){
      return (a.date||'') < (b.date||'') ? -1 : 1;
    });
    var cum = 0;
    var movesWithBal = movesOldFirst.map(function(m) {
      cum += parseFloat(m.boxes)||0;
      return { m: m, bal: Math.round(cum * 10) / 10 };
    });
    movesWithBal.reverse();

    var moveHtml = movesWithBal.length === 0
      ? '<tr><td colspan="6" class="text-muted text-center small py-2">無異動記錄</td></tr>'
      : movesWithBal.slice(0, 50).map(function(item) {
          var m = item.m, bal = item.bal;
          var boxes = parseFloat(m.boxes)||0;
          var qtyHtml = boxes >= 0
            ? '<span style="color:var(--ok-text);font-weight:600;">+'+boxes.toFixed(1)+' 箱</span>'
            : '<span style="color:#C0392B;font-weight:600;">'+boxes.toFixed(1)+' 箱</span>';
          var balPcs = p.qty_per_carton ? ' <small class="text-muted">≈'+(Math.round(bal*p.qty_per_carton))+' pcs</small>' : '';
          var locExp = escHtml(m.location||'AMZLGS')
            + (m.exp_date ? ' <small class="text-muted">EXP '+escHtml(m.exp_date)+'</small>' : '');
          var noteHtml = m.row_idx
            ? '<span class="note-cell" contenteditable="true" data-ridx="'+m.row_idx+'" onblur="saveNoteInline(this)">'+escHtml(m.note||'')+'</span>'
            : escHtml(m.note||'');
          return '<tr style="font-size:.78rem;">'
            +'<td class="text-muted">'+(m.date||'')+'</td>'
            +'<td>'+inferMvType(m)+'</td>'
            +'<td>'+qtyHtml+'</td>'
            +'<td><span class="fw-semibold">'+bal.toFixed(1)+' 箱</span>'+balPcs+'</td>'
            +'<td>'+locExp+'</td>'
            +'<td>'+noteHtml+'</td></tr>';
        }).join('');

    var uid = 'pd_' + (p.ean || p.sku || '').replace(/[^a-z0-9]/gi,'_');
    return '<tr class="product-row" style="cursor:pointer" onclick="toggleProdDetail(\'' + uid + '\')">'
      +'<td class="ps-2">'
      +'<div class="fw-bold" style="font-size:.85rem;">'+escHtml(p.name||'')+'</div>'
      +'<div class="text-muted" style="font-size:.72rem">'+escHtml(p.sku||'')+'</div>'
      +'</td>'
      +'<td style="font-size:.78rem;font-family:monospace;color:var(--text2)">'+escHtml(p.ean||'—')+'</td>'
      +'<td><span class="fw-semibold">'+(amz>0?amz.toFixed(1):'—')+'</span></td>'
      +rangeCell
      +'<td>'+stockStatus(amz)+'</td>'
      +'<td class="pe-2">'
      +'<button class="btn btn-xs btn-outline-secondary" style="font-size:.72rem;" onclick="event.stopPropagation();openMovementModal(\''+p.ean+'\')">異動</button>'
      +'</td>'
      +'</tr>'
      +'<tr id="'+uid+'" style="display:none">'
      +'<td colspan="'+(hasFilter?6:5)+'" style="padding:0;background:var(--bg2)">'
      +'<div class="px-3 py-2"><table id="det-'+uid+'" class="table table-sm mb-0" style="table-layout:fixed;width:100%;">'
      +'<colgroup>'
      +'<col style="width:13%"><col style="width:13%"><col style="width:12%">'
      +'<col style="width:18%"><col style="width:18%"><col style="width:26%">'
      +'</colgroup>'
      +'<thead><tr>'
      +'<th>異動時間</th>'
      +'<th>異動類型</th>'
      +'<th>數量變動</th>'
      +'<th>結餘庫存</th>'
      +'<th>倉庫 / 效期</th>'
      +'<th>備注 / 單號</th>'
      +'</tr></thead>'
      +'<tbody>'+moveHtml+'</tbody></table></div>'
      +'</td></tr>';
  });

  var tbody = document.getElementById('products-tbody');
  if (tbody) tbody.innerHTML = rows.join('');

  var tfoot = document.getElementById('products-tfoot');
  if (tfoot) {
    tfoot.innerHTML = '<tr style="background:var(--bg3);font-size:.8rem;font-weight:700;border-top:2px solid var(--border);">'
      +'<td class="ps-2" style="color:var(--text2);">共 '+prodList.length+' 項產品</td>'
      +'<td></td>'
      +'<td>'+totalAmz.toFixed(1)+' 箱</td>'
      +(hasFilter ? '<td></td>' : '')
      +'<td></td><td></td></tr>';
  }

  makeResizable('products-table');
}

function toggleProdDetail(uid) {
  var row = document.getElementById(uid);
  if (!row) return;
  var opening = row.style.display === 'none';
  row.style.display = opening ? '' : 'none';
  if (opening) makeResizable('det-' + uid);
}

function inferMvType(m) {
  var note  = (m.note     || '').toLowerCase();
  var loc   = (m.location || '').toLowerCase();
  var boxes = parseFloat(m.boxes) || 0;
  var cls, label;
  if (boxes >= 0) {
    cls = 'badge-in-mv';
    label = (note.indexOf('到貨') >= 0 || note.indexOf('transit') >= 0) ? '← 到貨' : '入庫';
  } else {
    if      (note.indexOf('dropship') >= 0 || note.indexOf('drop') >= 0) { cls = 'badge-out-fba';  label = 'Dropship'; }
    else if (note.indexOf('fba')      >= 0 || loc.indexOf('fba')  >= 0) { cls = 'badge-out-fba';  label = 'FBA';      }
    else if (note.indexOf('repack')   >= 0 || note.indexOf('包裝') >= 0) { cls = 'badge-secondary';label = '包裝';     }
    else if (note.indexOf('damage')   >= 0 || note.indexOf('損')   >= 0) { cls = 'badge-out-dmg';  label = '損壞';     }
    else if (note.indexOf('return')   >= 0 || note.indexOf('退')   >= 0) { cls = 'badge-out-ret';  label = '退回';     }
    else { cls = 'badge-out-fba'; label = '出庫'; }
  }
  return '<span class="mv-badge ' + cls + '">' + label + '</span>';
}


// ── Transit Functions ─────────────────────────────────────────────────────────
function openTransitModal() {
  var prodOpts = S.products.map(function(p) {

// ── Taiwan XLS Import ─────────────────────────────────────────────────────────
var _twImportRows = [];

function handleTaiwanImport(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var text = e.target.result;
    var lines = text.split(/\r?\n/);
    var parsed = [];
    for (var i = 0; i < lines.length; i++) {
      var clean = lines[i].replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').trim();
      if (/^\d{13}$/.test(clean)) {
        var ean = clean, pcs = null, exp = null;
        var _mon = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
        for (var j = i+1; j < Math.min(i+30, lines.length); j++) {
          var nx = lines[j].replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').trim();
          if (!nx) continue;
          if (/^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}$/.test(nx)) { exp = nx.replace(/\//g,'-'); break; }
          var mf = nx.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{1,2})\s+(\d{4})/);
          if (mf) { var mo=_mon[mf[1]],dy=+mf[2],yr=+mf[3]; exp=yr+'-'+(mo<10?'0':'')+mo+'-'+(dy<10?'0':'')+dy; break; }
          if (/^\d+$/.test(nx) && pcs === null) pcs = parseInt(nx);
        }
        if (pcs !== null) parsed.push({ ean: ean, pcs: pcs, exp: exp });
      }
    }
    if (parsed.length === 0) { showToast('找不到有效資料，請確認是倉庫系統匯出的 XLS', 'error'); return; }
    _twImportRows = parsed.map(function(r) {
      var prod = S.products.find(function(p){ return p.ean === r.ean; }) || {};
      var qpc = prod.qty_per_carton || 0;
      var boxes = qpc > 0 ? Math.round(r.pcs / qpc * 10) / 10 : r.pcs;
      return { ean: r.ean, name: prod.name || r.ean, pcs: r.pcs, boxes: boxes, exp: r.exp, qpc: qpc };
    });
    var tbody = document.getElementById('tw-preview-tbody');
    tbody.innerHTML = _twImportRows.map(function(r) {
      var boxStr = r.qpc > 0 ? r.boxes.toFixed(1)+' 箱' : r.pcs+' pcs（找不到每箱pcs，需手動換算）';
      return '<tr><td>'+escHtml(r.ean)+'</td><td>'+escHtml(r.name)+'</td><td>'+r.pcs+'</td><td>'+boxStr+'</td><td>'+(r.exp||'—')+'</td></tr>';
    }).join('');
    document.getElementById('tw-import-preview').style.display = '';
    document.getElementById('tw-xls-input').value = '';
  };
  reader.readAsText(file, 'big5');
}

function confirmTaiwanImport() {
  var btn = document.getElementById('tw-confirm-btn');
  if (btn && btn.disabled) return;
  if (!_twImportRows.length) return;
  if (!GAS_MODE) { showToast('本機模式無法寫入，請部署到 GAS 後操作', 'error'); return; }
  var total = _twImportRows.length;
  var today = new Date().toISOString().slice(0,10);
  var queue = _twImportRows.slice();
  var done = 0;
  if (btn) { btn.disabled = true; btn.textContent = '匯入中 0/'+total+'…'; }
  function next() {
    if (!queue.length) {
      if (btn) { btn.disabled = false; btn.textContent = '確認匯入'; }
      showToast('已匯入 '+done+' 筆台灣倉庫存', 'success');
      document.getElementById('tw-import-preview').style.display = 'none';
      _twImportRows = [];
      syncData();
      return;
    }
    var r = queue.shift();
    if (btn) btn.textContent = '匯入中 '+done+'/'+total+'…';
    var p = S.products.find(function(x){ return x.ean === r.ean; }) || {};
    gasCall('addTaiwanEntry', {
      ean: r.ean, name: p.name||'', sku: p.sku||'',
      date: today, boxes: r.boxes, qty_pcs: r.pcs,
      exp_date: r.exp||'', note: ''
    }, function() { done++; next(); }, function() { done++; next(); });
  }
  next();
}

// ── Column Resize ─────────────────────────────────────────────────────────────
function makeResizable(tableId) {
  var tbl = document.getElementById(tableId);
  if (!tbl) return;
  tbl.querySelectorAll('th').forEach(function(th) {
    if (th.querySelector('.col-rz')) return;
    th.style.position = 'relative';
    th.style.overflow = 'visible';
    var h = document.createElement('div');
    h.className = 'col-rz';
    th.appendChild(h);
    var startX, startW;
    h.addEventListener('pointerdown', function(e) {
      startX = e.clientX; startW = th.offsetWidth;
      h.setPointerCapture(e.pointerId);
      h.classList.add('dragging');
      e.preventDefault();
    });
    h.addEventListener('pointermove', function(e) {
      if (!h.hasPointerCapture(e.pointerId)) return;
      th.style.width = Math.max(40, startW + e.clientX - startX) + 'px';
    });
    h.addEventListener('pointerup', function(e) {
      h.releasePointerCapture(e.pointerId);
      h.classList.remove('dragging');
    });
  });
}

});

// ── Billing Month Picker ───────────────────────────────────────────────────────
var _blPickerMonth = '';
var _blPickerYear  = new Date().getFullYear();
var _blPickerOpen  = false;

function toggleBlPicker(e) {
  e && e.stopPropagation();
  _blPickerOpen = !_blPickerOpen;
  var panel = document.getElementById('bl-mpanel');
  if (_blPickerOpen) {
    _blPickerYear = _blPickerMonth ? parseInt(_blPickerMonth.slice(0,4)) : new Date().getFullYear();
    renderBlPickerMonths();
    panel.style.display = '';
  } else {
    panel.style.display = 'none';
  }
}

function navBlPickerYear(delta) {
  _blPickerYear += delta;
  renderBlPickerMonths();
}

function renderBlPickerMonths() {
  document.getElementById('bl-mpanel-yr').textContent = _blPickerYear;
  var months = {};
  S.billing.forEach(function(b) {
    var ym = String(b.date||'').slice(0,7);
    if (ym) months[ym] = true;
  });
  var labels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var html = '';
  for (var i = 1; i <= 12; i++) {
    var mm = (i < 10 ? '0' : '') + i;
    var ym = _blPickerYear + '-' + mm;
    var cls = 'mmon';
    if (ym === _blPickerMonth)  cls += ' selected';
    else if (months[ym])        cls += ' has-data';
    else                        cls += ' no-data';
    html += '<button class="'+cls+'" onclick="selectBlPickerMonth(\''+ym+'\')">'+labels[i-1]+'</button>';
  }
  document.getElementById('bl-mpanel-months').innerHTML = html;
}

function selectBlPickerMonth(ym) {
  _blPickerMonth = ym;
  var parts = ym.split('-');
  var labels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('bl-mpicker-label').textContent = labels[parseInt(parts[1])-1] + ' ' + parts[0];
  document.getElementById('bl-mpicker-btn').classList.add('on');
  closeBlPanel();
  renderBilling();
}

function clearBlFilter() {
  _blPickerMonth = '';
  document.getElementById('bl-mpicker-label').textContent = '全部月份';
  document.getElementById('bl-mpicker-btn').classList.remove('on');
  closeBlPanel();
  renderBilling();
}

function closeBlPanel() {
  _blPickerOpen = false;
  var p = document.getElementById('bl-mpanel');
  if (p) p.style.display = 'none';
}

  var url = document.getElementById('gasUrlInput').value.trim();
  if (url) { GAS_URL = url; localStorage.setItem('lab52_gas_url',''); localStorage.setItem('lab52_gas_url', url); }
  document.getElementById('sync-bar').style.display = 'none';
  syncData();
}

// ── Drag-to-scroll for .table-responsive ──────────────────────────────────────
(function() {
  var active = null, startX = 0, startScroll = 0, moved = false;
  document.addEventListener('mousemove', function(e) {
    if (!active) return;
    var dx = e.pageX - startX;
    if (!moved && Math.abs(dx) > 3) moved = true;
    if (!moved) return;
    e.preventDefault();
    active.scrollLeft = startScroll - dx;
    active.style.cursor = 'grabbing';
  });
  document.addEventListener('mouseup', function() {
    if (active) { active.style.cursor = ''; active.style.userSelect = ''; active = null; }
  });
  function initDragScroll(el) {
    if (el._ds) return;
    el._ds = true;
    el.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      if (e.target.closest('button,a,input,select,textarea,.note-cell,.col-rz')) return;
      active = el; startX = e.pageX; startScroll = el.scrollLeft; moved = false;
      el.style.userSelect = 'none';
    });
  }
  document.querySelectorAll('.table-responsive').forEach(initDragScroll);
  new MutationObserver(function(ms) {
    ms.forEach(function(m) {
      m.addedNodes.forEach(function(n) {
        if (n.nodeType !== 1) return;
        if (n.classList && n.classList.contains('table-responsive')) initDragScroll(n);
        if (n.querySelectorAll) n.querySelectorAll('.table-responsive').forEach(initDragScroll);
      });
    });
  }).observe(document.body, {childList:true, subtree:true});
})();

    }
    var cache = localStorage.getItem('lab52_cache');
    if (cache) {
      try { applyData(JSON.parse(cache)); } catch(e){}
    }
    if (S.products.length === 0) {
      loadDemoData();
    }
  }

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
      syncData();
    }
  });
})();
